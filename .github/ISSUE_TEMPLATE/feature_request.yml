name: Feature request
description: Propose a change or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include expected effects on recall, latency or memory if you know them.
