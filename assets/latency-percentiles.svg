<svg class="c" xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 736 336" width="720" height="320" role="img" aria-labelledby="t d">
<title id="t">Server-side search latency percentiles</title>
<desc id="d">First-seen queries (40 distinct queries, one run each): p50 240.0 ms, p90 265.5 ms, p95 273.6 ms, p99 276.8 ms. The same 8 queries repeated 20 times each (160 runs): p50 40.8 ms, p90 59.7 ms, p95 60.3 ms, p99 61.7 ms.</desc>
<style>
.c{--ink:#1f2328;--muted:#5b616b;--faint:#8a8f98;--grid:#e4e6ea;--accent:#0066cc;--mark:#8a8f98;--mark2:#c3c7cd}

.c text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:var(--ink);font-size:13px}
.c .m{fill:var(--muted)} .c .s{font-size:12px} .c .t{font-size:15px;font-weight:600} .c .b{font-weight:600}
.c .n{font-variant-numeric:tabular-nums}
.c .ax{stroke:var(--faint);stroke-width:1} .c .g{stroke:var(--grid);stroke-width:1}
.c .acc{fill:var(--accent)} .c .accs{stroke:var(--accent)} .c .mk{fill:var(--mark)} .c .mks{stroke:var(--mark)} .c .mk2{fill:var(--mark2)}
.c text.acct{fill:var(--accent)}
</style>
<rect x="-8" y="-8" width="736" height="336" fill="#ffffff"/>
<text x="0" y="22" class="t">Server-side search time, 300 million plus papers</text>
<text x="0" y="42" class="m s">Percentiles of elapsed_ms reported by the index, top 20 results per query</text>
